<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EN NANBA - Clinical Intelligence Platform End-to-End Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 md:p-10 flex flex-col items-center">

  <!-- Header & Download Toolbar -->
  <div class="max-w-6xl w-full flex flex-col md:flex-row items-center justify-between gap-4 mb-8 bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-xl backdrop-blur">
    <div>
      <div class="flex items-center gap-2">
        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-teal-500/20 text-teal-300 border border-teal-500/30">Complete Clinical Architecture</span>
        <span class="text-xs text-slate-400">EN NANBA Platform</span>
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-white mt-1">End-to-End Clinical Intelligence Flow</h1>
      <p class="text-sm text-slate-400">With all 5 Standards: ICD-11 • RxNorm • LOINC • UCUM • FHIR</p>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="downloadPNG()" class="px-5 py-2.5 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-teal-500/20 transition-all flex items-center gap-2 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download as Image (PNG)
      </button>
      <button onclick="downloadSVG()" class="px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-medium text-sm border border-slate-600 transition-all flex items-center gap-2 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        Download SVG
      </button>
      <button onclick="window.print()" class="px-3 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white border border-slate-600 transition-all cursor-pointer" title="Print / PDF">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
      </button>
    </div>
  </div>

  <!-- SVG Diagram Container -->
  <div class="max-w-6xl w-full bg-slate-950 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl overflow-x-auto flex justify-center">
    <svg id="flowchart-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" width="100%" height="auto" class="max-w-[950px]">
      <defs>
        <!-- Gradients -->
        <linearGradient id="grad-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
        <linearGradient id="grad-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
        <linearGradient id="grad-3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
        <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#064e3b"/></linearGradient>
        <linearGradient id="grad-5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#166534"/></linearGradient>
        <linearGradient id="grad-6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6b21a8"/><stop offset="100%" stop-color="#581c87"/></linearGradient>
        <linearGradient id="grad-7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#991b1b"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>

        <!-- Arrow Markers -->
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
      </defs>

      <!-- Background -->
      <rect width="1000" height="1600" fill="#0b1329" rx="20"/>

      <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5">EN NANBA CLINICAL INTELLIGENCE PLATFORM</text>
      <text x="500" y="70" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Complete 7-Step Pipeline: Patient Data ➔ Standards ➔ AI ➔ Doctor Decision</text>

      <!-- STEP 1 -->
      <g filter="url(#shadow)">
        <rect x="80" y="100" width="840" height="110" rx="14" fill="url(#grad-1)" stroke="#475569" stroke-width="2"/>
        <circle cx="120" cy="130" r="16" fill="#334155"/>
        <text x="120" y="135" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">1</text>
        <text x="150" y="135" fill="#38bdf8" font-size="15" font-weight="700">1. SIMPLE PATIENT DATA (RAW TEXT)</text>
        <text x="150" y="160" fill="#ffffff" font-size="12" font-weight="600">Doctor or clinic inputs plain human words (Zero medical codes):</text>
        <text x="150" y="185" fill="#94a3b8" font-size="11">"Patient Ramesh Patel has fever 102°F, Type 2 Diabetes, takes Metformin 500mg, allergic to Penicillin, HbA1c 8.2%"</text>
      </g>
      <line x1="500" y1="210" x2="500" y2="245" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- STEP 2 -->
      <g filter="url(#shadow)">
        <rect x="80" y="245" width="840" height="110" rx="14" fill="url(#grad-2)" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="120" cy="275" r="16" fill="#0369a1"/>
        <text x="120" y="280" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">2</text>
        <text x="150" y="280" fill="#ffffff" font-size="15" font-weight="700">2. AI CHECKS RAW TEXT (CLINICAL NLP)</text>
        <text x="150" y="305" fill="#e0f2fe" font-size="12">AI reads the sentence and automatically extracts entities into clinical buckets:</text>
        <text x="150" y="330" fill="#bae6fd" font-size="11">🔍 Disease: "Type 2 Diabetes"  |  💊 Medication: "Metformin"  |  ⚠️ Allergy: "Penicillin"  |  🧪 Lab: "HbA1c: 8.2%"</text>
      </g>
      <line x1="500" y1="355" x2="500" y2="390" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- STEP 3 -->
      <g filter="url(#shadow)">
        <rect x="80" y="390" width="840" height="190" rx="14" fill="url(#grad-3)" stroke="#14b8a6" stroke-width="2"/>
        <circle cx="120" cy="420" r="16" fill="#134e4a"/>
        <text x="120" y="425" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="bold">3</text>
        <text x="150" y="425" fill="#ffffff" font-size="15" font-weight="700">3. AI CALLS LIVE APIS TO FIND OFFICIAL CODES (THE 4 STANDARDS)</text>

        <!-- 4 API Cards -->
        <rect x="100" y="450" width="180" height="110" rx="10" fill="#042f2e" stroke="#14b8a6"/>
        <text x="190" y="475" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="bold">WHO ICD-11 API</text>
        <text x="190" y="495" text-anchor="middle" fill="#99f6e4" font-size="10">Diseases</text>
        <text x="190" y="525" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">'Type 2 Diabetes'</text>
        <text x="190" y="545" text-anchor="middle" fill="#2dd4bf" font-size="11">➔ Code: 5A11</text>

        <rect x="300" y="450" width="180" height="110" rx="10" fill="#042f2e" stroke="#14b8a6"/>
        <text x="390" y="475" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="bold">NIH RxNorm API</text>
        <text x="390" y="495" text-anchor="middle" fill="#99f6e4" font-size="10">Drugs & Allergies</text>
        <text x="390" y="525" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Metformin ➔ 6809</text>
        <text x="390" y="545" text-anchor="middle" fill="#2dd4bf" font-size="11">Penicillin ➔ 70618</text>

        <rect x="500" y="450" width="180" height="110" rx="10" fill="#042f2e" stroke="#14b8a6"/>
        <text x="590" y="475" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="bold">NIH LOINC API</text>
        <text x="590" y="495" text-anchor="middle" fill="#99f6e4" font-size="10">Lab Tests & Vitals</text>
        <text x="590" y="525" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">'Blood Sugar HbA1c'</text>
        <text x="590" y="545" text-anchor="middle" fill="#2dd4bf" font-size="11">➔ Code: 4548-4</text>

        <rect x="700" y="450" width="200" height="110" rx="10" fill="#042f2e" stroke="#14b8a6"/>
        <text x="800" y="475" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="bold">NIH UCUM API</text>
        <text x="800" y="495" text-anchor="middle" fill="#99f6e4" font-size="10">Units of Measurement</text>
        <text x="800" y="525" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Validates: '%', 'mg/dL'</text>
        <text x="800" y="545" text-anchor="middle" fill="#2dd4bf" font-size="11">➔ Standardized Units</text>
      </g>
      <line x1="500" y1="580" x2="500" y2="615" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- STEP 4 -->
      <g filter="url(#shadow)">
        <rect x="80" y="615" width="840" height="135" rx="14" fill="url(#grad-4)" stroke="#10b981" stroke-width="2"/>
        <circle cx="120" cy="645" r="16" fill="#064e3b"/>
        <text x="120" y="650" text-anchor="middle" fill="#86efac" font-size="14" font-weight="bold">4</text>
        <text x="150" y="650" fill="#ffffff" font-size="15" font-weight="700">4. FHIR PACKAGING & DATABASE STORAGE</text>

        <rect x="100" y="675" width="380" height="60" rx="8" fill="#022c22" stroke="#059669"/>
        <text x="120" y="700" fill="#6ee7b7" font-size="12" font-weight="bold">📦 FHIR Standard Bundle (JSON):</text>
        <text x="120" y="720" fill="#d1fae5" font-size="11">Condition (ICD-11) • Medication (RxNorm) • Observation (LOINC+UCUM)</text>

        <rect x="500" y="675" width="400" height="60" rx="8" fill="#022c22" stroke="#059669"/>
        <text x="520" y="700" fill="#6ee7b7" font-size="12" font-weight="bold">💾 Stored in Live PostgreSQL Database:</text>
        <text x="520" y="720" fill="#d1fae5" font-size="11">Saved permanently with clean standardized codes and audit timestamps</text>
      </g>
      <line x1="500" y1="750" x2="500" y2="785" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- STEP 5 -->
      <g filter="url(#shadow)">
        <rect x="80" y="785" width="840" height="160" rx="14" fill="url(#grad-5)" stroke="#22c55e" stroke-width="2"/>
        <circle cx="120" cy="815" r="16" fill="#14532d"/>
        <text x="120" y="820" text-anchor="middle" fill="#bbf7d0" font-size="14" font-weight="bold">5</text>
        <text x="150" y="820" fill="#ffffff" font-size="15" font-weight="700">5. AI ANALYZES ALL PAST + PRESENT DATA (CONTRADICTION RADAR)</text>

        <rect x="100" y="845" width="380" height="85" rx="8" fill="#052e16" stroke="#16a34a"/>
        <text x="120" y="870" fill="#f87171" font-size="12" font-weight="bold">🚨 Radar Safety Check (Past vs Present):</text>
        <text x="120" y="890" fill="#fca5a5" font-size="11">• Past: Allergic to Penicillin (70618)</text>
        <text x="120" y="910" fill="#ffffff" font-size="11" font-weight="bold">⛔ BLOCKS Amoxicillin (Fatal Anaphylaxis!)</text>

        <rect x="500" y="845" width="400" height="85" rx="8" fill="#052e16" stroke="#16a34a"/>
        <text x="520" y="870" fill="#86efac" font-size="12" font-weight="bold">💡 Gemini AI Recommended Safe Treatment:</text>
        <text x="520" y="890" fill="#dcfce7" font-size="11">• Safe Alternative: Prescribe Azithromycin 500mg</text>
        <text x="520" y="910" fill="#dcfce7" font-size="11">• Paracetamol 650mg for acute fever</text>
      </g>
      <line x1="500" y1="945" x2="500" y2="980" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- STEP 6 -->
      <g filter="url(#shadow)">
        <rect x="80" y="980" width="840" height="120" rx="14" fill="url(#grad-6)" stroke="#a855f7" stroke-width="2"/>
        <circle cx="120" cy="1010" r="16" fill="#581c87"/>
        <text x="120" y="1015" text-anchor="middle" fill="#e9d5ff" font-size="14" font-weight="bold">6</text>
        <text x="150" y="1015" fill="#ffffff" font-size="15" font-weight="700">6. SHOW TO DOCTOR (DOCTOR INTELLIGENCE WORKSPACE)</text>
        <text x="150" y="1045" fill="#f3e8ff" font-size="12">Doctor Screen clearly presents the complete clinical picture:</text>
        <text x="150" y="1075" fill="#d8b4fe" font-size="11">📋 Past Diseases & Vitals  |  🚨 Active Allergy Contradiction Warning  |  💡 Safe Treatment Proposal (Azithromycin)</text>
      </g>
      <line x1="500" y1="1100" x2="500" y2="1135" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- STEP 7 -->
      <g filter="url(#shadow)">
        <rect x="80" y="1135" width="840" height="180" rx="14" fill="url(#grad-7)" stroke="#ef4444" stroke-width="2"/>
        <circle cx="120" cy="1165" r="16" fill="#7f1d1d"/>
        <text x="120" y="1170" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="bold">7</text>
        <text x="150" y="1170" fill="#ffffff" font-size="15" font-weight="700">7. DOCTOR DECIDES NEXT (HUMAN FINAL CLINICAL SIGNATURE)</text>

        <!-- 3 Buttons -->
        <rect x="100" y="1195" width="240" height="95" rx="10" fill="#450a0a" stroke="#4ade80" stroke-width="2"/>
        <text x="220" y="1225" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">✅ 1. ACCEPT</text>
        <text x="220" y="1250" text-anchor="middle" fill="#ffffff" font-size="11">Doctor approves AI plan</text>
        <text x="220" y="1270" text-anchor="middle" fill="#94a3b8" font-size="10">Azithromycin 500mg approved</text>

        <rect x="380" y="1195" width="240" height="95" rx="10" fill="#450a0a" stroke="#fbbf24" stroke-width="2"/>
        <text x="500" y="1225" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">✏️ 2. MODIFY</text>
        <text x="500" y="1250" text-anchor="middle" fill="#ffffff" font-size="11">Doctor tweaks medicine/dose</text>
        <text x="500" y="1270" text-anchor="middle" fill="#94a3b8" font-size="10">Change to 250mg or swap drug</text>

        <rect x="660" y="1195" width="240" height="95" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
        <text x="780" y="1225" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">❌ 3. REJECT</text>
        <text x="780" y="1250" text-anchor="middle" fill="#ffffff" font-size="11">Doctor overrides AI</text>
        <text x="780" y="1270" text-anchor="middle" fill="#94a3b8" font-size="10">Reasoning logged in audit trail</text>
      </g>

      <!-- Final Arrow to Ledger -->
      <line x1="500" y1="1315" x2="500" y2="1350" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- PostgreSQL Ledger Summary -->
      <rect x="150" y="1350" width="700" height="60" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="500" y="1375" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">💾 SAVED TO LIVE POSTGRESQL (clinical_decisions & evidence_ledger)</text>
      <text x="500" y="1395" text-anchor="middle" fill="#94a3b8" font-size="11">Permanent immutable audit record with Doctor's Name, Timestamp, and Decision</text>
    </svg>
  </div>

  <div class="max-w-6xl w-full text-center mt-6 text-slate-500 text-xs">
    EN NANBA Clinical Intelligence Platform • ROACS Technologies
  </div>

  <!-- Export Script -->
  <script>
    function downloadSVG() {
      const svg = document.getElementById('flowchart-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = 'EN_NANBA_Complete_Clinical_Flow.svg';
      a.href = url;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svg = document.getElementById('flowchart-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      canvas.width = 2000;
      canvas.height = 3200;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      
      img.onload = function() {
        ctx.fillStyle = '#0b1329';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const a = document.createElement('a');
        a.download = 'EN_NANBA_Complete_Clinical_Flow.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
